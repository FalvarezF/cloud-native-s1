spring.application.name=sistema-tickets
spring.jpa.hibernate.ddl-auto=update
app.storage.efs-directory=${EFS_DIRECTORY:./data/tickets}
app.aws.region=${AWS_REGION:us-east-1}
app.aws.s3.bucket=${S3_BUCKET:}
app.aws.s3.auto-upload=${S3_AUTO_UPLOAD:false}
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600000}
app.security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
